[package]
name = "aialra-kimi-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Outbound-only Windows and Linux execution agent for AIALRA-KIMI"

[[bin]]
name = "aialra-kimi-agent"
path = "src/main.rs"

[[bin]]
name = "aialra-kimi-elevated-broker"
path = "src/broker_main.rs"

[dependencies]
anyhow = "1.0.99"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
clap = { version = "4.5.46", features = ["derive", "env"] }
directories = "6.0.0"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
futures-util = "0.3.31"
hkdf = "0.12.4"
portable-pty = "0.9.0"
rand = "0.8.5"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
subtle = "2.6.1"
time = { version = "0.3.44", features = ["formatting"] }
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.27.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.0", features = ["v4", "serde"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = { version = "1.8.1", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Cryptography",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Threading"
] }
windows-service = "0.8.1"

[dev-dependencies]
tempfile = "3.21.0"
