name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Assemble the immutable control-plane release
        run: |
          mkdir -p artifacts/stage
          pnpm --filter @aialra-kimi/control-plane --prod deploy --legacy artifacts/stage/control-plane
          cp -R apps/web/dist artifacts/stage/web
          cp LICENSE THIRD_PARTY_NOTICES.md upstream.lock.json artifacts/stage/
          rm -rf artifacts/stage/control-plane/src artifacts/stage/control-plane/test artifacts/stage/control-plane/scripts
          tar -C artifacts/stage -czf artifacts/aialra-kimi-control-plane-linux-x64.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: control-plane
          path: artifacts/aialra-kimi-control-plane-linux-x64.tar.gz

  agent:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: aialra-kimi-agent-linux-x64.tar.gz
          - os: windows-latest
            artifact: aialra-kimi-agent-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - run: rustup default 1.95.0
      - run: cargo test --manifest-path crates/agent/Cargo.toml
      - run: cargo build --manifest-path crates/agent/Cargo.toml --release --bins
      - name: Package Linux agent
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts/agent
          cp target/release/aialra-kimi-agent LICENSE THIRD_PARTY_NOTICES.md artifacts/agent/
          tar -C artifacts/agent -czf artifacts/${{ matrix.artifact }} .
      - name: Package Windows agent and elevated broker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/agent | Out-Null
          Copy-Item target/release/aialra-kimi-agent.exe,target/release/aialra-kimi-elevated-broker.exe,LICENSE,THIRD_PARTY_NOTICES.md artifacts/agent/
          Compress-Archive -Path artifacts/agent/* -DestinationPath artifacts/${{ matrix.artifact }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-${{ runner.os }}
          path: artifacts/${{ matrix.artifact }}

  publish:
    needs: [control-plane, agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          merge-multiple: true
      - name: Create release checksums
        run: cd release && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "release/*"
      - name: Publish immutable GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --generate-notes
