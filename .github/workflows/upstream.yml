name: Kimi upstream candidate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 2"

permissions:
  contents: write
  pull-requests: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh the pinned release and live protocol hashes
        run: pnpm refresh:upstream
      - run: pnpm check
      - run: pnpm build
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: automation/kimi-upstream-candidate
          delete-branch: true
          commit-message: "chore: refresh the pinned Kimi candidate"
          title: "chore: validate the latest Kimi Code candidate"
          body: |
            This automated candidate records the upstream tag, commit, release checksums, and live OpenAPI and AsyncAPI hashes

            Production promotion remains manual and requires the repository contract, browser, security, and deployment gates
          labels: upstream-candidate
