name: Kimi upstream candidate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 2"

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh the pinned release and live protocol hashes
        run: pnpm refresh:upstream
      - run: pnpm check
      - run: pnpm build
      - name: Report a real upstream candidate
        run: |
          if git diff --quiet -- upstream.lock.json; then
            echo "Kimi upstream remains pinned without changes"
            exit 0
          fi

          {
            echo "## Kimi upstream candidate detected"
            echo
            echo "The pinned release or protocol changed. Review and promote it directly through main."
            echo
            git diff --stat -- upstream.lock.json
          } >> "$GITHUB_STEP_SUMMARY"
          git diff -- upstream.lock.json
          echo "::error::A real Kimi upstream candidate requires manual review and direct main promotion"
          exit 1
