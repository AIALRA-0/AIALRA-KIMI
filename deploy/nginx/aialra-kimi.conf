map $http_upgrade $aialra_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kimi.example.com;

    ssl_certificate /etc/ssl/aialra-kimi/origin.pem;
    ssl_certificate_key /etc/ssl/aialra-kimi/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $aialra_connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }
}
